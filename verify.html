<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شنب ستور - نظام التحقق</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: #050811; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 40px 20px; position: relative; overflow-x: hidden; }
        body::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: repeating-linear-gradient(-25deg, transparent, transparent 15px, rgba(0, 150, 255, 0.08) 15px, rgba(0, 150, 255, 0.08) 17px); pointer-events: none; animation: moveBackground 15s linear infinite; }
        @keyframes moveBackground { 0% { transform: translateY(0) translateX(0); } 100% { transform: translateY(50px) translateX(-50px); } }
        .container { width: 100%; max-width: 520px; z-index: 1; display: flex; flex-direction: column; align-items: center; }
        .logo-box { width: 130px; height: 130px; border-radius: 50%; border: 2px solid #00a2ff; box-shadow: 0 0 25px rgba(0, 162, 255, 0.6); margin-bottom: 15px; background: #090d16; overflow: hidden; }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; }
        .main-title { font-size: 38px; font-weight: 800; background: linear-gradient(135deg, #ffffff 0%, #00a2ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 25px; }
        .card { background: rgba(10, 14, 26, 0.85); border: 1px solid rgba(0, 162, 255, 0.25); border-radius: 16px; width: 100%; padding: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.9); backdrop-filter: blur(12px); }
        .view-section { display: none; }
        .view-section.active { display: block; }
        .btn { width: 100%; padding: 14px; border-radius: 8px; border: none; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-blue { background: linear-gradient(135deg, #0055ff, #00a2ff); color: #fff; }
        .btn-green { background: linear-gradient(135deg, #16a34a, #22c55e); color: #fff; }
        .input-field { width: 100%; background: #060913; border: 1px solid #1e293b; border-radius: 10px; padding: 14px; color: #fff; text-align: center; font-size: 16px; margin-bottom: 10px; outline: none; }
        .input-field:focus { border-color: #00a2ff; }
        .otp-container { display: flex; justify-content: space-between; gap: 8px; margin: 20px 0; direction: ltr; }
        .otp-input { width: 15%; height: 50px; background: #060913; border: 1px solid #1e293b; border-radius: 8px; color: #00a2ff; font-size: 20px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-box">
            <img src="https://cdn.discordapp.com/avatars/1401997487908196414/f73ce7bf49d0b4fdf16547ce6e920848.webp" alt="شنب ستور">
        </div>
        <h1 class="main-title">شنب ستور</h1>

        <div class="card">
            <!-- شاشة رقم الهاتف -->
            <div id="viewPhone" class="view-section active">
                <h2 style="color: #00a2ff; text-align: center; margin-bottom: 10px;">أدخل رقم هاتفك</h2>
                <p style="color: #94a3b8; text-align: center; font-size: 12px; margin-bottom: 20px;">سيرسل لك رمز التحقق عبر واتساب</p>
                <input type="text" id="phoneNumber" class="input-field" placeholder="+966501234567">
                <button class="btn btn-blue" onclick="sendOTP()">إرسال رمز التحقق</button>
            </div>

            <!-- شاشة الرمز OTP -->
            <div id="viewOTP" class="view-section">
                <h2 style="color: #00a2ff; text-align: center; margin-bottom: 10px;">أدخل رمز التحقق</h2>
                <div class="otp-container">
                    <input type="text" maxlength="1" class="otp-input" onkeyup="moveFocus(this, 0)">
                    <input type="text" maxlength="1" class="otp-input" onkeyup="moveFocus(this, 1)">
                    <input type="text" maxlength="1" class="otp-input" onkeyup="moveFocus(this, 2)">
                    <input type="text" maxlength="1" class="otp-input" onkeyup="moveFocus(this, 3)">
                    <input type="text" maxlength="1" class="otp-input" onkeyup="moveFocus(this, 4)">
                    <input type="text" maxlength="1" class="otp-input" onkeyup="moveFocus(this, 5)">
                </div>
                <button class="btn btn-green" onclick="confirmOTP()">تحقق</button>
            </div>

            <!-- شاشة النجاح -->
            <div id="viewSuccess" class="view-section">
                <h2 style="color: #22c55e; text-align: center; margin-bottom: 10px;">تم التحقق بنجاح!</h2>
                <p style="color: #94a3b8; text-align: center; font-size: 13px;">مرحباً بك في سيرفر شنب ستور.</p>
            </div>
        </div>
    </div>

    <script>
        let userId = "user_" + Math.random().toString(36).substr(2, 9);

        function sendOTP() {
            const phone = document.getElementById('phoneNumber').value.trim();
            
            fetch('/api/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, phone })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    document.getElementById('viewPhone').classList.remove('active');
                    document.getElementById('viewOTP').classList.add('active');
                } else {
                    alert(data.error);
                }
            });
        }

        function confirmOTP() {
            let otp = "";
            document.querySelectorAll('.otp-input').forEach(input => otp += input.value);

            fetch('/api/confirm-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, otp })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    document.getElementById('viewOTP').classList.remove('active');
                    document.getElementById('viewSuccess').classList.add('active');
                } else {
                    alert(data.error);
                }
            });
        }

        function moveFocus(element, index) {
            const inputs = document.querySelectorAll('.otp-input');
            if (element.value.length === 1 && index < 5) {
                inputs[index + 1].focus();
            }
        }
    </script>
</body>
</html>
